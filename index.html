<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>王者荣耀春节皮肤购买 - 完整流程版</title>
    <script src="https://cdn.staticfile.net/vue/3.3.4/vue.global.min.js"></script>
    <style>
        /* =========================================================
           🎯 坐标与间距配置区 (直接修改这里的数字即可)
           ========================================================= */
        :root {
                    /* --- 1. 主界面：大模块位置 --- */
            --preview-top: 70px;       /* 预览图距离顶部 */
            --preview-left: 200px;      /* 预览图距离左侧 */

            --keys-top: 120px;        /* 左上角按键区距离顶部 */
            --keys-left: 230px;       /* 左上角按键区距离左侧 */
            
            /* 🌟 新增：左侧按键全选勾选框的坐标微调 */
            --keys-checkbox-top: 0px; /* 按键全选框向下偏移量 */
            --keys-checkbox-left: -10px;/* 按键全选框向右偏移量 */

            --key-price-top: 70px;    /* 按键价格距离按键区顶部 */
            --key-price-left: 40px;    /* 按键价格距离按键区左侧 */

            --list-offset-top: 90px;  /* 右侧列表整体向下偏移 */
            --list-offset-right: 95px;/* 右侧列表整体向左偏移 (距离右侧的距离) */

            --checkout-bottom: 110px;  /* 购买按钮距离底部 */
            --checkout-right: 20px;    /* 购买按钮距离右侧 */
            
            --purchase-close-top: 20px;   /* 购买弹窗关闭按钮距离顶部 */
            --purchase-close-right: 20px; /* 购买弹窗关闭按钮距离右侧 */

          /* --- 2. 主界面：列表内部间距 --- */
            --bundle-gap: 30px;       /* 第一行(礼包)与第二行的间距 */
            --skin-row-gap: 40px;     /* 皮肤列表的行间距 */
            --skin-col-gap: 40px;     /* 皮肤列表的列间距(左右) */


            /* --- 3. 主界面：商品元素细节坐标 --- */
            --item-frame-top: -5px;    /* 选中框距离商品图顶部 */
            --item-frame-left: -5px;   /* 选中框距离商品图左侧 */

            --item-checkbox-top: -10px; /* 勾选框距离商品图顶部 (可随意移到外部，不会被裁切) */
            --item-checkbox-left: -10px;/* 勾选框距离商品图左侧 */

            --item-price-bottom: -20px; /* 价格文字距离商品图底部 */
            --item-price-left: 0px;   /* 价格文字距离商品图左侧 (默认0，靠居中对齐) */

            --checkout-text-top: 0px; /* 购买按钮文字整体向下偏移量 */
            --checkout-text-left: 0px;/* 购买按钮文字整体向右偏移量 */

            /* --- 4. 二次确认弹窗：坐标配置 --- */
            --confirm-price-top: 120px;    /* 总价格距离弹窗顶部 */
            --confirm-price-left: 0px;     /* 总价格距离弹窗左侧 (默认0，靠居中对齐) */

            --confirm-items-top: 200px;    /* 商品列表距离弹窗顶部 */
            
            /* 弹窗列表遮罩与居中配置 (520px 刚好露出6个半) */
            --confirm-list-width: 520px;   /* 列表可视区域宽度，超出部分会被遮挡并可滑动 */
            --confirm-list-left: 50%;      /* 列表距离左侧 (默认50%居中) */
            --confirm-list-transform: translateX(-50%); /* 配合50%实现绝对居中 */
            
            --confirm-item-gap: 15px;      /* 确认弹窗中，商品图标之间的间距 */

            --confirm-btn-bottom: 30px;    /* 确认购买按钮距离弹窗底部 */
            --confirm-btn-left: 0px;       /* 确认购买按钮距离弹窗左侧 (默认0，靠居中对齐) */
        }
        /* ========================================================= */

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: #000;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            font-family: "Microsoft YaHei", sans-serif;
        }
        img { display: block; } 

        #app {
            width: 1560px; height: 720px; position: relative;
            overflow: hidden; background-color: #1a1a1a; 
        }

        .original-price { font-size: 14px; color: rgba(255,255,255,0.6); text-decoration: line-through; margin-left: 8px; }

        .home-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            cursor: pointer; z-index: 10;
        }
        .home-screen img { width: 100%; height: 100%; object-fit: cover; }

        .modal-mask {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); 
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }

        .purchase-modal { position: relative; display: inline-block; }
        .modal-bg-under { position: relative; z-index: 1; }
        .preview-img-over { position: absolute; top: var(--preview-top); left: var(--preview-left); z-index: 2; }

        .modal-content-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 3; display: flex; pointer-events: none; 
        }
        .modal-content-layer > * { pointer-events: auto; }

        .btn-close-purchase {
            position: absolute; top: var(--purchase-close-top); right: var(--purchase-close-right);
            cursor: pointer; z-index: 50;
        }

        .preview-section { width: 1020px; position: relative; height: 100%; }
        
        .recommend-keys { position: absolute; top: var(--keys-top); left: var(--keys-left); z-index: 10; }
        .key-list { display: flex; gap: 10px; align-items: center; }
        
        .keys-all-checkbox {
            position: relative;
            top: var(--keys-checkbox-top);
            left: var(--keys-checkbox-left);
            cursor: pointer;
            z-index: 20; 
        }

        .key-item { position: relative; display: inline-block; cursor: pointer; }
        .key-item .frame-selected {
            position: absolute; top: -2px; left: -2px; width: calc(100% + 4px); height: calc(100% + 4px);
            z-index: 2; pointer-events: none;
        }
        
        .key-price-text {
            position: absolute; top: var(--key-price-top); left: var(--key-price-left);
            display: flex; align-items: center; color: #fff; font-size: 14px; width: max-content;
        }
        .key-price-text img { margin-right: 4px; }

        .list-section { 
            flex: 1; padding: 0; position: relative; 
            display: flex; flex-direction: column; align-items: flex-end;
            top: var(--list-offset-top); right: var(--list-offset-right);
        }
        
        .items-container { width: max-content; overflow: visible; padding-right: 10px; }

        .bundle-box { margin-bottom: var(--bundle-gap); }
        .skins-grid { 
            display: grid; grid-template-columns: auto auto; 
            row-gap: var(--skin-row-gap); column-gap: var(--skin-col-gap); 
        }

        .item-box { position: relative; cursor: pointer; display: inline-block; }
        .item-box .frame-selected { 
            position: absolute; top: var(--item-frame-top); left: var(--item-frame-left); 
            pointer-events: none; z-index: 2; 
        }

        .price-text {
            position: absolute; bottom: var(--item-price-bottom); left: var(--item-price-left); 
            width: 100%; text-align: center; color: #fff; font-size: 14px; z-index: 3;
            display: flex; justify-content: center; align-items: center;
        }
        .price-text img { margin-right: 4px; }

        .item-box .img-checkbox { 
            position: absolute; top: var(--item-checkbox-top); left: var(--item-checkbox-left); 
            cursor: pointer; z-index: 5; 
        }

        .checkout-section { position: absolute; bottom: var(--checkout-bottom); right: var(--checkout-right); }
        .btn-checkout { position: relative; cursor: pointer; display: inline-block; }
        .btn-checkout .content {
            position: absolute; top: var(--checkout-text-top); left: var(--checkout-text-left); 
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; 
            color: #fff; font-size: 24px; font-weight: bold;
        }
        .btn-checkout .content img { margin-right: 8px; }

        @keyframes btn-flash {
            0% { filter: brightness(1) drop-shadow(0 0 0px rgba(255, 255, 255, 0)); }
            50% { filter: brightness(1.8) drop-shadow(0 0 20px rgba(100, 200, 255, 0.8)); }
            100% { filter: brightness(1) drop-shadow(0 0 0px rgba(255, 255, 255, 0)); }
        }
        .anim-refresh {
            animation: btn-flash 0.4s ease-out;
        }

        .confirm-modal { position: relative; display: inline-block; }
        .confirm-content-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; 
        }
        .confirm-content-layer > * { pointer-events: auto; }

        .confirm-price {
            position: absolute; top: var(--confirm-price-top); left: var(--confirm-price-left);
            width: 100%; color: #f8e4a5; font-size: 32px; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
        }
        .confirm-price img { margin-right: 10px; }
        
        .confirm-items-viewport { 
            position: absolute; 
            top: var(--confirm-items-top); 
            left: var(--confirm-list-left);
            transform: var(--confirm-list-transform);
            width: var(--confirm-list-width); 
            overflow-x: auto;
            scrollbar-width: none; 
            -webkit-overflow-scrolling: touch; 
            cursor: grab; 
        }
        .confirm-items-viewport:active { cursor: grabbing; }
        .confirm-items-viewport::-webkit-scrollbar { display: none; } 

        .confirm-items-list { 
            display: flex; 
            gap: var(--confirm-item-gap); 
            width: max-content; 
            padding: 0 5px; 
        }
        .confirm-items-list.is-center {
            min-width: 100%;
            justify-content: center;
        }

        .confirm-item { text-align: center; display: flex; flex-direction: column; align-items: center; }
        .confirm-item p { color: #fff; font-size: 12px; margin-top: 8px; }
        .confirm-item img { -webkit-user-drag: none; pointer-events: none; }

        .confirm-btn-group { 
            position: absolute; bottom: var(--confirm-btn-bottom); left: var(--confirm-btn-left);
            width: 100%; display: flex; justify-content: center; cursor: pointer; 
        }
        .btn-close { position: absolute; top: 15px; right: 20px; cursor: pointer; z-index: 20; }
    </style>
</head>
<body>

<div id="app">
    <div class="home-screen" v-if="showHome" @click="openPurchaseModal">
        <img src="bg_home.jpg">
    </div>

    <div class="modal-mask" v-if="showPurchaseModal">
        <div class="purchase-modal">
            
            <img src="bg_modal.png" class="modal-bg-under">
            <img :src="currentDisplayPreviewImg" class="preview-img-over">
            
            <div class="modal-content-layer">
                <img src="btn_close.png" class="btn-close-purchase" @click="closePurchaseModal">

                <div class="preview-section">
                    <div class="recommend-keys">
                        <div class="key-list">
                            <div class="keys-all-checkbox" @click="toggleCurrentKeys">
                                <img :src="isCurrentKeysChecked ? 'icon_checkbox_checked.png' : 'icon_checkbox_normal.png'">
                            </div>
                            <div class="key-item" v-for="key in currentDisplayKeys" :key="key.id" @click="selectKeyPreview(key.id)" v-show="currentPreviewId !== bundleData.id">
                                <img src="frame_selected.png" class="frame-selected" v-if="currentPreviewKeyId === key.id">
                                <img :src="key.icon">
                            </div>
                        </div>
                        <div class="key-price-text" v-show="currentPreviewId !== bundleData.id && currentDisplayKeys.length > 0">
                            <img src="icon_gem.png">
                            99 <span class="original-price">188</span>
                        </div>
                    </div>
                </div>

                <div class="list-section">
                    <div class="items-container">
                        <div class="item-box bundle-box" @click="selectPreview(bundleData.id)">
                            <img src="frame_selected-2.png" class="frame-selected" v-if="currentPreviewId === bundleData.id && !currentPreviewKeyId">
                            <div class="img-checkbox" @click.stop="toggleCheck(bundleData.id)">
                                <img :src="isBundleChecked ? 'icon_checkbox_checked.png' : 'icon_checkbox_normal.png'">
                            </div>
                            <img :src="bundleData.icon">
                        </div>

                        <div class="skins-grid">
                            <div class="item-box" v-for="skin in skinsData" :key="skin.id" @click="selectPreview(skin.id)">
                                <img src="frame_selected.png" class="frame-selected" v-if="currentPreviewId === skin.id && !currentPreviewKeyId">
                                <div class="img-checkbox" @click.stop="toggleCheck(skin.id)">
                                    <img :src="checkedItemIds.includes(skin.id) ? 'icon_checkbox_checked.png' : 'icon_checkbox_normal.png'">
                                </div>
                                <img :src="skin.icon">
                                <div class="price-text">
                                    <img src="icon_gem.png">
                                    {{ getSkinDisplayPrice(skin.id) }} <span class="original-price">{{ skin.originalPrice }}</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="checkout-section">
                        <div class="btn-checkout" :class="{ 'anim-refresh': isBtnRefreshing }" @click="openConfirmModal">
                            <img src="btn_buy_blue.png">
                            <div class="content">
                                <img src="icon_gem.png">
                                {{ finalTotalPrice }}
                                <span class="original-price">{{ finalOriginalPrice }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-mask" v-if="showConfirmModal">
        <div class="confirm-modal">
            <img src="bg_confirm.png">
            <div class="confirm-content-layer">
                <img src="btn_close.png" class="btn-close" @click="showConfirmModal = false">
                
                <div class="confirm-price">
                    <img src="icon_gem.png">
                    {{ finalTotalPrice }}
                </div>
                
                <div class="confirm-items-viewport" 
                     ref="viewportRef"
                     @mousedown="startDrag"
                     @mouseleave="stopDrag"
                     @mouseup="stopDrag"
                     @mousemove="onDrag">
                    <div class="confirm-items-list" :class="{ 'is-center': finalCheckedItemsData.length <= 6 }">
                        <div class="confirm-item" v-for="item in finalCheckedItemsData" :key="item.id">
                            <img :src="item.icon">
                            <p>{{ item.name }}</p>
                        </div>
                    </div>
                </div>
                
                <div class="confirm-btn-group" @click="executePurchase">
                    <img src="btn_confirm.png">
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const { createApp, ref, computed, watch } = Vue;

createApp({
    setup() {
        const showHome = ref(true);
        const showPurchaseModal = ref(false);
        const showConfirmModal = ref(false);
        
        const currentPreviewId = ref('skin_1');
        const currentPreviewKeyId = ref(null); 

        const checkedItemIds = ref(['skin_1']); 
        const checkedKeyIds = ref([]);          
        const useLuckyCard = ref(true); 
        
        const isBtnRefreshing = ref(false);

        const bundleData = { 
            id: 'bundle_1', name: '全套皮肤+按键礼包', 
            price: 7740, originalPrice: 10728, 
            icon: 'item_bundle.png', 
            previewImg: 'preview_bundle.png',
            previewImgNoKey: 'preview_bundle-2.png' 
        };
        
        const skinsData = [
            { id: 'skin_1', name: '神骥·鸣幻洲', price: 1430, originalPrice: 1788, icon: 'item_skin1.png', previewImg: 'preview_skin1.png', keyId: 'key_1' },
            { id: 'skin_2', name: '神骥·越千峰', price: 1430, originalPrice: 1788, icon: 'item_skin2.png', previewImg: 'preview_skin2.png', keyId: 'key_2' },
            { id: 'skin_3', name: '皮肤3', price: 1430, originalPrice: 1788, icon: 'item_skin3.png', previewImg: 'preview_skin3.png', keyId: 'key_3' },
            { id: 'skin_4', name: '皮肤4', price: 1430, originalPrice: 1788, icon: 'item_skin4.png', previewImg: 'preview_skin4.png', keyId: 'key_4' },
            { id: 'skin_5', name: '皮肤5', price: 1430, originalPrice: 1788, icon: 'item_skin5.png', previewImg: 'preview_skin5.png', keyId: 'key_5' },
            { id: 'skin_6', name: '皮肤6', price: 1430, originalPrice: 1788, icon: 'item_skin6.png', previewImg: 'preview_skin6.png', keyId: 'key_6' },
        ];

        const keysData = [
            { id: 'key_1', name: '鸣幻洲按键', price: 99, originalPrice: 188, icon: 'key_1.png', previewImg: 'preview_key1.png' },
            { id: 'key_2', name: '越千峰按键', price: 99, originalPrice: 188, icon: 'key_2.png', previewImg: 'preview_key2.png' },
            { id: 'key_3', name: '按键3', price: 99, originalPrice: 188, icon: 'key_3.png', previewImg: 'preview_key3.png' },
            { id: 'key_4', name: '按键4', price: 99, originalPrice: 188, icon: 'key_4.png', previewImg: 'preview_key4.png' },
            { id: 'key_5', name: '按键5', price: 99, originalPrice: 188, icon: 'key_5.png', previewImg: 'preview_key5.png' },
            { id: 'key_6', name: '按键6', price: 99, originalPrice: 188, icon: 'key_6.png', previewImg: 'preview_key6.png' },
        ];

        const isBundleChecked = computed(() => {
            return skinsData.every(skin => checkedItemIds.value.includes(skin.id));
        });

        const currentDisplayPreviewImg = computed(() => {
            if (currentPreviewKeyId.value) {
                const key = keysData.find(k => k.id === currentPreviewKeyId.value);
                return key ? key.previewImg : '';
            }
            if (currentPreviewId.value === bundleData.id) {
                // 🌟 修复：如果仅仅是点击预览礼包（未勾选全套），默认展示完整礼包图
                // 只有在“已勾选全套礼包”且“取消了按键”的情况下，才展示无按键版
                if (isBundleChecked.value) {
                    const allKeysChecked = keysData.every(k => checkedKeyIds.value.includes(k.id));
                    return allKeysChecked ? bundleData.previewImg : bundleData.previewImgNoKey;
                }
                return bundleData.previewImg;
            }
            const skin = skinsData.find(s => s.id === currentPreviewId.value);
            return skin ? skin.previewImg : '';
        });

        const currentDisplayKeys = computed(() => {
            if (currentPreviewId.value === bundleData.id) return keysData;
            const skin = skinsData.find(s => s.id === currentPreviewId.value);
            return keysData.filter(k => k.id === skin.keyId);
        });

        const isCurrentKeysChecked = computed(() => {
            const displayIds = currentDisplayKeys.value.map(k => k.id);
            if (displayIds.length === 0) return false;
            return displayIds.every(id => checkedKeyIds.value.includes(id));
        });

        const hasSkinChecked = computed(() => {
            return checkedItemIds.value.some(id => id.startsWith('skin_'));
        });

        const getSkinDisplayPrice = (skinId) => {
            const skin = skinsData.find(s => s.id === skinId);
            if (!useLuckyCard.value) return skin.price;
            
            const firstCheckedSkinId = checkedItemIds.value.find(id => id.startsWith('skin_'));
            if (firstCheckedSkinId === skinId) {
                return skin.price - 840;
            }
            return skin.price;
        };

        const finalTotalPrice = computed(() => {
            let total = 0;
            if (isBundleChecked.value) {
                total = bundleData.price + (checkedKeyIds.value.length * 99);
            } else {
                let skinCount = 0;
                checkedItemIds.value.forEach(id => {
                    if (id.startsWith('skin_')) {
                        total += skinsData.find(s => s.id === id).price;
                        skinCount++;
                    }
                });
                if (useLuckyCard.value && skinCount > 0) total -= 840;
                checkedKeyIds.value.forEach(id => {
                    total += keysData.find(k => k.id === id).price;
                });
            }
            return total;
        });

        const finalOriginalPrice = computed(() => {
            let total = 0;
            if (isBundleChecked.value) {
                total = bundleData.originalPrice + (checkedKeyIds.value.length * 188);
            } else {
                checkedItemIds.value.forEach(id => {
                    if (id.startsWith('skin_')) total += skinsData.find(s => s.id === id).originalPrice;
                });
                checkedKeyIds.value.forEach(id => {
                    total += keysData.find(k => k.id === id).originalPrice;
                });
            }
            return total;
        });

        watch([checkedItemIds, checkedKeyIds], () => {
            isBtnRefreshing.value = false;
            setTimeout(() => {
                isBtnRefreshing.value = true;
                setTimeout(() => {
                    isBtnRefreshing.value = false;
                }, 400); 
            }, 10);
        }, { deep: true });

        const finalCheckedItemsData = computed(() => {
            let items = [];
            checkedItemIds.value.forEach(id => {
                const skin = skinsData.find(s => s.id === id);
                if (skin) items.push(skin);
            });
            checkedKeyIds.value.forEach(id => {
                const key = keysData.find(k => k.id === id);
                if (key) items.push(key);
            });
            return items;
        });

        const toggleCheck = (id) => {
            selectPreview(id);

            if (id === bundleData.id) {
                if (isBundleChecked.value) {
                    checkedItemIds.value = [];
                    checkedKeyIds.value = [];
                } else {
                    checkedItemIds.value = skinsData.map(s => s.id);
                    checkedKeyIds.value = keysData.map(k => k.id);
                }
                return;
            }

            const index = checkedItemIds.value.indexOf(id);
            if (index > -1) {
                checkedItemIds.value.splice(index, 1);
            } else {
                checkedItemIds.value.push(id);
            }
        };

        const toggleCurrentKeys = () => {
            const displayIds = currentDisplayKeys.value.map(k => k.id);
            if (isCurrentKeysChecked.value) {
                checkedKeyIds.value = checkedKeyIds.value.filter(id => !displayIds.includes(id));
            } else {
                displayIds.forEach(id => {
                    if (!checkedKeyIds.value.includes(id)) checkedKeyIds.value.push(id);
                });
            }
        };

        const selectPreview = (id) => { 
            currentPreviewId.value = id; 
            currentPreviewKeyId.value = null; 
        };

        const selectKeyPreview = (keyId) => {
            currentPreviewKeyId.value = keyId;
        };
        
        const openPurchaseModal = () => {
            showHome.value = false;
            showPurchaseModal.value = true;
        };

        const closePurchaseModal = () => {
            showPurchaseModal.value = false;
            showHome.value = true;
        };

        const openConfirmModal = () => {
            if (checkedItemIds.value.length === 0 && checkedKeyIds.value.length === 0) {
                alert('请至少勾选一件商品！');
                return;
            }
            showConfirmModal.value = true;
        };

        const executePurchase = () => {
            alert(`购买成功！共消耗 ${finalTotalPrice.value} 点券`);
            showConfirmModal.value = false;
            checkedItemIds.value = ['skin_1'];
            checkedKeyIds.value = [];
            currentPreviewId.value = 'skin_1';
            currentPreviewKeyId.value = null;
        };

        const viewportRef = ref(null);
        let isDragging = false;
        let startX;
        let scrollLeft;

        const startDrag = (e) => {
            isDragging = true;
            startX = e.pageX - viewportRef.value.offsetLeft;
            scrollLeft = viewportRef.value.scrollLeft;
        };
        const stopDrag = () => {
            isDragging = false;
        };
        const onDrag = (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const x = e.pageX - viewportRef.value.offsetLeft;
            const walk = (x - startX) * 1.5; 
            viewportRef.value.scrollLeft = scrollLeft - walk;
        };

        return {
            showHome, showPurchaseModal, showConfirmModal, 
            openPurchaseModal, closePurchaseModal,         
            currentPreviewId, currentPreviewKeyId, checkedItemIds, checkedKeyIds, 
            bundleData, skinsData, keysData, isBundleChecked,
            currentDisplayPreviewImg, currentDisplayKeys, isCurrentKeysChecked, hasSkinChecked,
            getSkinDisplayPrice, finalTotalPrice, finalOriginalPrice, finalCheckedItemsData,
            selectPreview, selectKeyPreview, toggleCheck, toggleCurrentKeys, openConfirmModal, executePurchase,
            isBtnRefreshing,
            viewportRef, startDrag, stopDrag, onDrag 
        };
    }
}).mount('#app');
</script>
</body>
</html>
